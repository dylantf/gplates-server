services:
  gplates-postgis:
    image: gplates/postgis
    hostname: gplates-postgis
    networks: [gplates-net]
    restart: on-failure

  gplates-redis:
    image: redis
    hostname: gplates-redis
    networks: [gplates-net]
    restart: unless-stopped

  gws:
    image: gplates/gws
    hostname: gws
    networks: [gplates-net]
    depends_on: [gplates-postgis, gplates-redis]
    ports:
      - "18000:80"
    restart: on-failure

networks:
  gplates-net:
    name: gplates-net
    driver: bridge
